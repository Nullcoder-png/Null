  <script>
    const scriptsList = [
      [".test.txt", "test1 for now"],
      [".test.txt", "test2 for now"],
      [".test.txt", "test 3for now"]
    ];

    const container = document.getElementById('scriptsContainer');

    scriptsList.forEach((item, index) => {
      const filePath = item[0];
      const scriptName = item[1];
      const scriptId = "script_" + index;

      const itemDiv = document.createElement('div');
      itemDiv.className = 'script-item';

      itemDiv.innerHTML = `
        <div class="script-header" onclick="toggleScript('${scriptId}')">
          <span>${scriptName}</span>
          <span>&#9660;</span>
        </div>
        <div class="script-content" id="${scriptId}">
          <div class="path-label">${filePath}</div>
          <textarea readonly data-src="${filePath}">who let the dog out...</textarea>
        </div>
      `;

      container.appendChild(itemDiv);
    });

    function toggleScript(id) {
      const el = document.getElementById(id);
      if (el.style.display === "block") {
        el.style.display = "none";
      } else {
        el.style.display = "block";
        const textarea = el.querySelector('textarea');
        const filePath = textarea.getAttribute('data-src');
        if (textarea.value === "loading file content...") {
          fetch(filePath)
            .then(response => {
              if (!response.ok) throw new Error("failed to load file");
              return response.text();
            })
            .then(data => {
              textarea.value = data;
            })
            .catch(error => {
              textarea.value = "error loading external file: " + filePath;
            });
        }
      }
    }
  </script>
